[package]
name = "wrtc"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-timer = { version = "3", features = ["wasm-bindgen"] }
log = { version = "0.4", default-features = false }
console_error_panic_hook = "0.1.7"
console_log = "1.0"
futures = { version = "0.3", default-features = false }
wasm-bindgen-futures = "0.4.29"
web-sys = { version = "0.3.69", features = ["Worker"] }
wasm-bindgen = "0.2.92"
js-sys = "0.3.69"
bytes = "1.6.0"
tracing = "0.1.41"
matchbox_socket = { git = "ssh://git@github.com/wavey-ai/matchbox" }
serde = "1.0.216"
async-trait = "0.1.83"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1.42.0", features = ["full"] }
xmpegts = { git = "ssh://git@github.com/wavey-ai/xiu" }
playlists = { git = "ssh://git@github.com/wavey-ai/playlists.git" }
matchbox_signaling = { git = "ssh://git@github.com/wavey-ai/matchbox" }
axum = "0.7.9"
matchbox_protocol = { git = "ssh://git@github.com/wavey-ai/matchbox" }

[lib]
crate-type = ["cdylib", "rlib"]
